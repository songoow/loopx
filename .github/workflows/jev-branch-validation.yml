name: Jev branch validation

on:
  push:
    branches: [codex/jev-integrated-pilot]
  pull_request:
    branches: [codex/jev-integrated-pilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    if: github.repository == 'songoow/loopx' && (github.ref == 'refs/heads/codex/jev-integrated-pilot' || github.base_ref == 'codex/jev-integrated-pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        area: [adapter, d7, d8, typed-regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 04ba65ac1a37c94d964adeedf3ff1f125c5ffe12
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install isolated test dependencies
        run: |
          python -m pip install 'pytest==9.1.1' 'pyyaml>=6,<7' 'jsonschema>=4.23,<5' 'mcp==1.28.1'
          python -m pip install --no-deps -e project/packages/loopx-jev
      - name: Test original owners and optional pilot
        working-directory: project
        env:
          JEV_TEST_AREA: ${{ matrix.area }}
          JEV_BASE_DIR: ${{ github.workspace }}/baseline
        shell: bash
        run: |
          export PYTHONPATH="$PWD/packages/loopx-jev/src:$PWD:$PWD/tests:$PWD/tests/control_plane"
          git rev-parse HEAD
          node --version
          python --version
          case "$JEV_TEST_AREA" in
            adapter) python -m pytest packages/loopx-jev/tests/test_adapter.py packages/loopx-jev/tests/test_advisory.py packages/loopx-jev/tests/test_ranking_outcomes.py packages/loopx-jev/tests/test_atomic_ranking.py -q --junitxml="$RUNNER_TEMP/jev-adapter.xml" ;;
            d7) python -m pytest packages/loopx-jev/tests/test_d7.py tests/control_plane/test_scoped_gate_fallback_cli.py tests/control_plane/test_todo_decision_scope_runtime_boundary.py tests/control_plane/test_todo_decision_scope_consistency.py -q --junitxml="$RUNNER_TEMP/jev-d7.xml" ;;
            d8) python -m pytest packages/loopx-jev/tests/test_d8.py tests/test_explore_router_acceptance.py tests/test_explore_resource_portfolio.py tests/test_explore_monitor_lane_budget.py tests/test_explore_worker_topic_affinity.py -q --junitxml="$RUNNER_TEMP/jev-d8.xml" ;;
            typed-regression) node --no-warnings --experimental-sqlite --experimental-strip-types --test tests/control_plane_ts/scoped_gate_fallback.test.ts tests/control_plane_ts/decision_scope.test.ts tests/control_plane_ts/turn_settlement.test.ts ;;
          esac
          git diff --check
      - name: Retain test results
        if: always() && matrix.area != 'typed-regression'
        uses: actions/upload-artifact@v4
        with:
          name: jev-${{ matrix.area }}-results
          path: ${{ runner.temp }}/jev-*.xml
          if-no-files-found: warn
          retention-days: 7
